dataset:
  repo_id: mmoukouba/MedPix-VQA
  revision: 69eb219d477ab8699296da1fd6b89beb768042d3
  train_rows: 17420
  validation_rows: 3080
  train_distinct_encoded_images_sha256: 1742
  validation_distinct_encoded_images_sha256: 308
  qa_rows_per_train_image: 10
  split_used: train
  validation_used: false
  image_column: image_id
  question_column: question
  answer_column: answer
  unused_columns:
  - mode
  - case_id
  conversation:
  - role: user
    content:
    - type: image
      source_column: image_id
    - type: text
      source_column: question
  - role: assistant
    content:
    - type: text
      source_column: answer
processor:
  class: nemo_automodel.components.models.deepseek_v41.processing.DeepseekV41Processor
  repo_id: deepseek-ai/DeepSeek-V4.1-Flash
  revision: df42c109f1defefcbfcedbe7d905718a12266e40
  patch_size: 14
  downsample_ratio: 3
  max_image_tokens: 1024
  min_pixels: 295936
  max_wh_ratio: null
  image_mode: RGB
  padding_color:
  - 127
  - 127
  - 127
  normalization: (pixel / 255 - 0.5) / 0.5, then BF16
  augmentations: none
  image_span_tokens: ceil(vit_h / 3) * (ceil(vit_w / 3) + 1) + 2
  special_token_ids:
    bos: 0
    eos: 1
    pad: 1
    user: 128803
    assistant: 128804
    think_end: 128822
    image: 129264
  chat_rendering: native DeepseekV41Processor.apply_chat_template; image then two
    newlines then question; no extra system prompt
  unexpanded_single_qa_template: '<｜begin▁of▁sentence｜><｜User｜><｜deepseek_image｜>


    {question}<｜Assistant｜></think>{answer}<｜end▁of▁sentence｜>'
ordering:
  raw_shuffle: HF Dataset.shuffle(seed=1234), once
  pack_shuffle: random.Random(1234).shuffle(native_bins), once
  trim: drop the shuffled tail bins to a whole multiple of GBS
  epoch_shuffle: false
  pack_index: (optimizer_step * GBS + accumulation_microbatch * DP + dp_rank) % retained_pack_count
  indices_in_manifest: indices into the raw shuffled dataset, not original parquet
    row indices
label_and_boundary_processing:
  label_builder: build_labels_from_template
  ignore_index: -100
  per_document_shift: input_ids[:-1], labels[1:] before concatenation
  per_document_padding: pad token ID 1; ignored labels -100
  position_ids: restart from 0 for each document; per-document padding included in
    padded length
  attention: packed document isolation; no cross-document attention
  image_order: original document order, image before question; no deduplication
  supervised_region: assistant answer and first EOS inclusive; assistant role marker
    and </think>, user prompt, image tokens, padding are ignored (-100)
  pretokenized_max_retries: 10
  packed_max_retries: 10
